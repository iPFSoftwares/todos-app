services:
  api:
    build:
      context: ./todos-api
      dockerfile: Dockerfile.dev
    networks:
      - todos_app_network
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DATABASE_URL=/app/data/data.sqlite
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./todos-api:/app
      - /app/node_modules
      - todos_app_data:/app/data

  ui:
    build:
      context: ./todos-ui
      dockerfile: Dockerfile.dev
    networks:
      - todos_app_network
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=
      - API_PROXY_TARGET=http://api:8080
    volumes:
      - ./todos-ui:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  todos_app_data:

networks:
  todos_app_network:
    driver: bridge
