services:
  api:
    build: ./todos-api
    image: todos-api:latest
    networks:
      - todos_app_network
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - PORT=8080
      - DATABASE_URL=/app/data/data.sqlite
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - todos_app_data:/app/data

  ui:
    build:
      context: ./todos-ui
      args:
        VITE_API_URL: ""
    networks:
      - todos_app_network
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  todos_app_data:

networks:
  todos_app_network:
    driver: bridge
